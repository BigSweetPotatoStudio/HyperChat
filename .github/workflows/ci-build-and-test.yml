name: ci-build-and-test

# on: [push, pull_request]
on:
  workflow_dispatch: {}
  push:
    branches-ignore:
      - doc
      - alpha
      - stable
      - main

jobs:
  install:
    name: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史

      - name: Get event details
        id: details
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::set-output name=type::推送"
            echo "::set-output name=message::$(git log -1 --pretty=format:%s)"
            echo "::set-output name=author::$(git log -1 --pretty=format:%an)"
            echo "::set-output name=sha::$(git log -1 --pretty=format:%h)"
            echo "::set-output name=url::${{ github.event.head_commit.url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::set-output name=type::拉取请求"
            echo "::set-output name=message::${{ github.event.pull_request.title }}"
            echo "::set-output name=author::${{ github.event.pull_request.user.login }}"
            echo "::set-output name=url::${{ github.event.pull_request.html_url }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "::set-output name=type::议题${{ github.event.action }}"
            echo "::set-output name=message::${{ github.event.issue.title }}"
            echo "::set-output name=author::${{ github.event.issue.user.login }}"
            echo "::set-output name=url::${{ github.event.issue.html_url }}"
          fi

      - name: Get changed files
        id: files
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::set-output name=changed::$(git diff --name-only HEAD^1 HEAD | tr '\n' ', ')"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::set-output name=changed::$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | tr '\n' ', ')"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install global dependencies
        run: npm install -g cross-env zx tsx

      - name: Install python-setuptools
        if: matrix.os == 'macos-latest'
        run: brew install python-setuptools

      # 统一的依赖缓存 - 包含 workspace 和 scripts 的 node_modules
      - name: Cache workspace dependencies
        uses: actions/cache@v4
        id: cache-workspace-deps
        with:
          path: |
            node_modules
            scripts/node_modules
            packages/shared/node_modules
            packages/core/node_modules
            packages/web/node_modules
          key: ${{ matrix.os }}-node-workspace-${{ hashFiles('package-lock.json', 'scripts/package-lock.json', 'packages/shared/package-lock.json', 'packages/core/package-lock.json', 'packages/web/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-workspace-

      # 统一安装 workspace 依赖（如果缓存未命中）
      - name: Install workspace dependencies
        if: steps.cache-workspace-deps.outputs.cache-hit != 'true'
        run: |
          npm install
          cd scripts && npm install

      # packages/electron 目录的依赖缓存（独立安装）
      - name: Cache electron dependencies
        uses: actions/cache@v4
        id: cache-electron
        with:
          path: packages/electron/node_modules
          key: ${{ matrix.os }}-node-electron-${{ hashFiles('packages/electron/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-electron-

      # 安装 electron 目录依赖（如果缓存未命中）
      - name: Install electron dependencies
        if: steps.cache-electron.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ./packages/electron

  build-and-test:
    name: build-and-test
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install global dependencies
        run: npm install -g cross-env zx tsx

      # 恢复 workspace 依赖缓存
      - name: Restore workspace dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            scripts/node_modules
            packages/shared/node_modules
            packages/core/node_modules
            packages/web/node_modules
          key: ${{ matrix.os }}-node-workspace-${{ hashFiles('package-lock.json', 'scripts/package-lock.json', 'packages/shared/package-lock.json', 'packages/core/package-lock.json', 'packages/web/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-workspace-
          fail-on-cache-miss: true

      # 恢复 electron 依赖缓存
      - name: Restore electron dependencies
        uses: actions/cache@v4
        with:
          path: packages/electron/node_modules
          key: ${{ matrix.os }}-node-electron-${{ hashFiles('packages/electron/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-electron-
          fail-on-cache-miss: true

      # 检查 shared 目录ts 类型
      - name: check shared types
        run: |
          npx tsc --noEmit
          npm run build
        working-directory: ./packages/shared
        
      # 检查 web 目录ts 类型
      - name: check web types
        run: npx tsc --noEmit
        working-directory: ./packages/web

      # 检查 core 目录ts 类型
      - name: check core types
        run: npx tsc --noEmit
        working-directory: ./packages/core


      # 检查 electron 目录ts 类型
      - name: check electron types
        run: npx tsc --noEmit
        working-directory: ./packages/electron

      - name: Send Telegram Message
        if: matrix.os == 'ubuntu-latest'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            🔔 <b>CI构建测试 ${{ steps.details.outputs.type }}通知</b>

            📂 <b>仓库:</b> ${{ github.repository }}
            👤 <b>作者:</b> ${{ steps.details.outputs.author }}
            🔍 <b>提交:</b> <code>${{ steps.details.outputs.sha }}</code>

            📝 <b>标题:</b> ${{ steps.details.outputs.message }}
            📄 <b>修改的文件:</b>
            <code>${{ steps.files.outputs.changed }}</code>

            ✅ <b>状态:</b> TypeScript类型检查通过
            🔗 <b>详情链接:</b> ${{ steps.details.outputs.url }}
            ⏰ <b>时间:</b> ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.issue.updated_at }}

            #GitHub #CI #TypeScript

      - name: Send Error Notification
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ❌ <b>CI构建测试失败</b>

            📂 <b>仓库:</b> ${{ github.repository }}
            👤 <b>作者:</b> ${{ steps.details.outputs.author }}
            🔍 <b>工作流:</b> ${{ github.workflow }}

            💥 <b>失败原因:</b> TypeScript类型检查或依赖安装失败
            🔗 <b>详情链接:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            请检查 GitHub Actions 日志以获取更多详情。

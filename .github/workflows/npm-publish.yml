# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - alpha
      - stable

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v3.0.0

      - name: Setup Node.js and Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: '22.16.0'
          install-global: 'cross-env zx tsx'
          install-scripts: 'true'
          install-python-setuptools: 'true'

      # 判断当前分支和版本类型
      - name: Determine release type
        id: release-type
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          
          if [[ $BRANCH_NAME == "alpha" ]]; then
            if [[ $PACKAGE_VERSION == *"-alpha"* ]]; then
              echo "should_publish=true" >> $GITHUB_OUTPUT
              echo "publish_tag=alpha" >> $GITHUB_OUTPUT
              echo "is_alpha=true" >> $GITHUB_OUTPUT
              echo "Alpha branch with alpha version - will publish with alpha tag"
            else
              echo "should_publish=false" >> $GITHUB_OUTPUT
              echo "is_alpha=false" >> $GITHUB_OUTPUT
              echo "Alpha branch but not alpha version - skipping publish"
            fi
          elif [[ $BRANCH_NAME == "stable" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "publish_tag=latest" >> $GITHUB_OUTPUT
            echo "is_alpha=false" >> $GITHUB_OUTPUT
            echo "Stable branch - will publish with latest tag"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "is_alpha=false" >> $GITHUB_OUTPUT
            echo "Unknown branch - skipping publish"
          fi

      # 同步版本号
      - name: Sync Version
        if: steps.release-type.outputs.should_publish == 'true'
        run: npm run version:sync

      # 发布所有包到 npm
      - name: Publish all packages to npm
        if: steps.release-type.outputs.should_publish == 'true'
        run: npm run publish:all
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
          NPM_PUBLISH_TAG: ${{ steps.release-type.outputs.publish_tag }}

      # Git 配置和重置
      - name: Setup Git and reset
        if: steps.release-type.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD 
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # 为 alpha 版本创建新的预发布版本
      - name: Bump alpha version
        if: steps.release-type.outputs.is_alpha == 'true'
        run: npm version prerelease --preid=alpha

      # 推送版本变更
      - name: Push changes
        if: steps.release-type.outputs.should_publish == 'true'
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - alpha
      - stable

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v3.0.0

      - name: Install Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org/

      - name: Install -g
        run: npm install -g cross-env zx

      # 根目录的依赖缓存
      - name: Cache root dependencies
        uses: actions/cache@v3
        id: cache-root
        with:
          path: node_modules
          key: ${{ matrix.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-

      # 安装根目录依赖（如果缓存未命中）
      - name: Install root dependencies
        if: steps.cache-root.outputs.cache-hit != 'true'
        run: npm install

      # web 目录的依赖缓存
      - name: Cache web dependencies
        uses: actions/cache@v3
        id: cache-web
        with:
          path: web/node_modules
          key: ${{ matrix.os }}-node-web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-web-

      # 安装 web 目录依赖（如果缓存未命中）
      - name: Install web dependencies
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ./web

      # electron 目录的依赖缓存
      - name: Cache electron dependencies
        uses: actions/cache@v3
        id: cache-electron
        with:
          path: electron/node_modules
          key: ${{ matrix.os }}-node-electron-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-electron-

      # 安装 electron 目录依赖（如果缓存未命中）
      - name: Install electron dependencies
        if: steps.cache-electron.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ./electron

      # 判断当前分支和版本类型
      - name: Determine release type
        id: release-type
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          
          if [[ $BRANCH_NAME == "alpha" ]]; then
            if [[ $PACKAGE_VERSION == *"-alpha"* ]]; then
              echo "should_publish=true" >> $GITHUB_OUTPUT
              echo "publish_tag=alpha" >> $GITHUB_OUTPUT
              echo "is_alpha=true" >> $GITHUB_OUTPUT
              echo "Alpha branch with alpha version - will publish with alpha tag"
            else
              echo "should_publish=false" >> $GITHUB_OUTPUT
              echo "is_alpha=false" >> $GITHUB_OUTPUT
              echo "Alpha branch but not alpha version - skipping publish"
            fi
          elif [[ $BRANCH_NAME == "stable" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "publish_tag=latest" >> $GITHUB_OUTPUT
            echo "is_alpha=false" >> $GITHUB_OUTPUT
            echo "Stable branch - will publish with latest tag"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "is_alpha=false" >> $GITHUB_OUTPUT
            echo "Unknown branch - skipping publish"
          fi

      # 为 alpha 版本更新版本号
      - name: Update Version (Alpha)
        if: steps.release-type.outputs.is_alpha == 'true'
        run: npm run updateVersion

      # 为 stable 版本更新版本号  
      - name: Update Version (Stable)
        if: steps.release-type.outputs.branch == 'stable'
        run: npm run updateVersion

      # 构建生产版本
      - name: Build Production Node
        if: steps.release-type.outputs.should_publish == 'true'
        run: npm run prod_node

      # 发布到 npm
      - name: Publish to npm
        if: steps.release-type.outputs.should_publish == 'true'
        run: |
          if [[ "${{ steps.release-type.outputs.publish_tag }}" == "alpha" ]]; then
            cd electron && npm publish --tag alpha --access=public
          else
            cd electron && npm publish --access=public
          fi
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}

      # Git 配置和重置
      - name: Setup Git and reset
        if: steps.release-type.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD 
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # 为 alpha 版本创建新的预发布版本
      - name: Bump alpha version
        if: steps.release-type.outputs.is_alpha == 'true'
        run: npm version prerelease --preid=alpha

      # 推送版本变更
      - name: Push changes
        if: steps.release-type.outputs.should_publish == 'true'
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
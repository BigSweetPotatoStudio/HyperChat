name: HyperChat electron app

on:
  workflow_dispatch: {}
  push:
    branches:
      - dev2          # 开发分支发布 alpha
      - stable        # 稳定分支发布 release
      - new_code_tool # 临时测试分支
  pull_request:
    branches:
      - dev2
      - stable
      - new_code_tool # 临时测试分支

jobs:
  release:
    name: electron app
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 获取完整的 git 历史

      - name: Get event details
        id: details
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::set-output name=type::推送"
            echo "::set-output name=message::$(git log -1 --pretty=format:%s)"
            echo "::set-output name=author::$(git log -1 --pretty=format:%an)"
            echo "::set-output name=sha::$(git log -1 --pretty=format:%h)"
            echo "::set-output name=url::${{ github.event.head_commit.url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::set-output name=type::拉取请求"
            echo "::set-output name=message::${{ github.event.pull_request.title }}"
            echo "::set-output name=author::${{ github.event.pull_request.user.login }}"
            echo "::set-output name=url::${{ github.event.pull_request.html_url }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "::set-output name=type::议题${{ github.event.action }}"
            echo "::set-output name=message::${{ github.event.issue.title }}"
            echo "::set-output name=author::${{ github.event.issue.user.login }}"
            echo "::set-output name=url::${{ github.event.issue.html_url }}"
          fi

      - name: Get changed files
        id: files
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::set-output name=changed::$(git diff --name-only HEAD^1 HEAD | tr '\n' ', ')"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::set-output name=changed::$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | tr '\n' ', ')"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "22.16.0"

      - name: Install -g
        run: npm install -g cross-env zx

      - name: Install python-setuptools
        if: matrix.os == 'macos-latest'
        run:
          brew install python-setuptools

          # 根目录的依赖缓存
      - name: Cache root dependencies
        uses: actions/cache@v3
        id: cache-root
        with:
          path: node_modules
          key: ${{ matrix.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-

      # 安装根目录依赖（如果缓存未命中）
      - name: Install root dependencies
        if: steps.cache-root.outputs.cache-hit != 'true'
        run: npm install

      # packages 目录的依赖缓存
      - name: Cache packages dependencies
        uses: actions/cache@v3
        id: cache-packages
        with:
          path: |
            packages/shared/node_modules
            packages/core/node_modules
            packages/web/node_modules
            packages/electron/node_modules
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ matrix.os }}-node-packages-${{ hashFiles('packages/*/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-packages-

      # 安装所有 packages 依赖（如果缓存未命中）
      - name: Install packages dependencies
        if: steps.cache-packages.outputs.cache-hit != 'true'
        run: |
          cd packages/shared && npm install --include=optional
          cd ../core && npm install --include=optional
          cd ../web && npm install --include=optional && npm install favicons
          cd ../electron && npm install --include=optional

      # 构建共享库
      - name: Build shared package
        run: cd packages/shared && npm run build

      # 构建核心包
      - name: Build core package
        run: cd packages/core && npm run build

      # 构建Web包
      - name: Build web package
        run: cd packages/web && npm run build

      # 缓存构建产物
      - name: Cache build outputs
        uses: actions/cache@v3
        with:
          path: |
            packages/shared/dist
            packages/core/dist
            packages/web/build
          key: ${{ matrix.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-build-

      # 根据分支决定发布类型
      - name: Publish Alpha (dev2 branch)
        if: github.ref == 'refs/heads/dev2' && matrix.os == 'macos-latest'
        run: cd packages/electron && npm run publish:alpha
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_HARD_LINKS: false

      - name: Publish Release (stable branch)
        if: github.ref == 'refs/heads/stable' && matrix.os == 'macos-latest'
        run: cd packages/electron && npm run publish:release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_HARD_LINKS: false

      - name: Publish Alpha (dev2 branch) - Windows/Linux
        if: github.ref == 'refs/heads/dev2' && (matrix.os == 'windows-latest' || matrix.os == 'ubuntu-latest')
        run: cd packages/electron && npm run publish:alpha
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish Release (stable branch) - Windows/Linux
        if: github.ref == 'refs/heads/stable' && (matrix.os == 'windows-latest' || matrix.os == 'ubuntu-latest')
        run: cd packages/electron && npm run publish:release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Pull Request 时只构建不发布
      - name: Build only (Pull Request)
        if: github.event_name == 'pull_request'
        run: cd packages/electron && npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            🔔 <b>GitHub ${{ steps.details.outputs.type }}通知</b>

            📂 <b>仓库:</b> ${{ github.repository }}
            👤 <b>作者:</b> ${{ steps.details.outputs.author }}
            🔍 <b>提交:</b> <code>${{ steps.details.outputs.sha }}</code>

            📝 <b>标题:</b> ${{ steps.details.outputs.message }}
            📄 <b>修改的文件:</b>
            <code>${{ steps.files.outputs.changed }}</code>

            🔗 <b>详情链接:</b> ${{ steps.details.outputs.url }}
            ⏰ <b>时间:</b> ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.issue.updated_at }}

            #GitHub #${{ steps.details.outputs.type }}

      - name: Send Error Notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ❌ <b>GitHub Action 失败</b>

            📂 <b>仓库:</b> ${{ github.repository }}
            🔍 <b>工作流:</b> ${{ github.workflow }}

            请检查 GitHub Actions 日志以获取更多详情。
